version: 2
updates:
  # OSS開発用の package.json(リポジトリルート、配布対象外)の依存関係を監視する。
  # Dependabotの設定は既定ブランチ(main)から読まれるため、本体の開発ブランチ(develop)を
  # target-branchに指定する。
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"

  # .github/workflows/*.yml 内の actions/* をコミットSHA固定にしているため、
  # SHAの更新(タグへの追従)はDependabotに任せる運用とする。
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
