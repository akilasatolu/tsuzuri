version: 2

# 依存の更新PRは、公開から30日たった版だけを対象にする(cooldown)。
# npm では、乗っ取られたアカウントから不正なコードを仕込んだ版が公開され、数時間〜数日後に
# 取り下げられる事件が起きている。公開直後の版をすぐに取り込まないことで、その危険を避ける。
# (脆弱性を直すセキュリティ更新は cooldown の対象外で、すぐにPRが作られる)
#
# 安定版だけを対象にする: Dependabot は、今使っている版が安定版なら、alpha・beta・rc などの
# プレリリース版へは更新しない。このリポジトリの依存はすべて安定版に固定しているので、
# プレリリース版のPRは作られない(プレリリース版を依存に書かないこと)。
#
# PRは自動マージしない。マージの前に、変更内容とリリースノートを確認する(開発者向け README 参照)。
updates:
  # OSS開発用の package.json(リポジトリルート、配布対象外)の依存関係を監視する。
  # marked・highlight.js・marked-footnote(とその依存)の更新PRでは、利用者に配る lockfile の完成品
  # (templates/tsuzuri/)も `node scripts/build-lockfiles.mjs` で作り直してPRに含める
  # (作り直さないとテストが失敗する。手順は README.md の「依存パッケージの更新」)。
  # gemoji(絵文字のショートコードの表の元。利用者には配らない開発用の依存)の更新PRでは、
  # `node scripts/build-emoji-data.mjs` を実行して .github/scripts/lib/emoji-data.mjs を作り直し、
  # その差分も同じPRに入れる(作り直さないと test/emoji.test.mjs の一致のテストが失敗する。手順は README.md)。
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30

  # 生成ページが CDN から読み込む mermaid のバージョン(.github/scripts/lib/html-renderer.mjs の
  # MERMAID_VERSION)。deps/mermaid/package.json に同じバージョンを書いて監視させる。
  # 更新のPRが来たら、MERMAID_VERSION も同じバージョンに直す(直さないとテストが失敗する)。
  - package-ecosystem: "npm"
    directory: "/deps/mermaid"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30

  # .github/workflows/*.yml 内の actions/* をコミットSHA固定にしているため、
  # SHAの更新(タグへの追従)はDependabotに任せる運用とする。
  # "/templates" は init が利用者リポジトリに生成するワークフローのひな形
  # (templates/.github/workflows/docs-pages.yml)。ここで使う actions も更新対象にする。
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/templates"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30
