name: 機能要望
description: 新機能や改善の提案をする
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        機能要望ありがとうございます。以下の項目をできるだけ具体的にご記入ください。

  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 現状どのような課題や不便があるかを説明してください。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
      description: どのような機能・変更があれば課題が解決するかを説明してください。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
      description: 他に検討した方法があれば記載してください。
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: 補足情報
      description: 関連するIssue/PR、参考リンクなどがあれば記載してください。
    validations:
      required: false
