name: CI

# OSS本体自身の開発用CI(配布対象外)。
# lint・test・ワークフローの静的チェック(actionlint)のみを行う。GitHub Pagesへのデプロイは一切行わないため、
# pages/id-token権限は不要(contents: readのみで完結する)。
# このワークフローはmainブランチ(tsuzuri本体の開発ブランチ)にのみ存在する。
# このリポジトリ自身のPagesデプロイは、docsブランチ(tsuzuriで作ったユーザー向けサイト)
# 側の docs-pages.yml が単独で担当しており、このワークフローとは競合しない。
#
# 開発者が任意のブランチにpushしても、ここで実行されるのはlint・testだけであり、
# GitHub Pagesや外部リポジトリに影響する処理は一切走らない。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    # 利用者が手元で npx を実行する Node.js は様々なので、対応範囲(package.json の engines)を
    # すべて試す。生成ワークフロー・sync-docs は Node.js 24 で動く。
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # 依存のインストールスクリプトは実行しない(.npmrc でも同じ設定にしている)
      - run: npm ci --ignore-scripts
      # 依存がすべて npm の正規の署名付きで配布されたものか確認する(改ざん・なりすましの検出)
      - name: Verify registry signatures
        if: matrix.node-version == 24
        run: npm audit signatures
      - run: npm run lint
      - run: npm test

  # ワークフローの静的チェック(actionlint。run のシェルスクリプトは shellcheck でも確認される)。
  # このリポジトリのワークフローに加えて、init が生成するワークフロー(ひな形のプレースホルダーを
  # 置き換えた後の内容)も確認する。
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Render generated workflow
        run: node -e 'import("./bin/cli.mjs").then((m) => process.stdout.write(m.buildDocsPagesYml()))' > "$RUNNER_TEMP/docs-pages.yml"
      - name: Run actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION" "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" -color .github/workflows/*.yml "$RUNNER_TEMP/docs-pages.yml"

  # 生成ページが CDN から読み込む mermaid のファイルのハッシュが、MERMAID_INTEGRITY(SRI)と
  # 一致しているか確かめる(mermaid の版を上げたときの更新漏れを見つける)。
  verify-cdn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify mermaid integrity
        run: node scripts/mermaid-integrity.mjs --check
