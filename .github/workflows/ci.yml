name: CI

# OSS本体自身の開発用CI(配布対象外)。
# lint・testのみを行う。GitHub Pagesへのデプロイは一切行わないため、
# pages/id-token権限は不要(contents: readのみで完結する)。
# このワークフローはmainブランチ(tsuzuri本体の開発ブランチ)にのみ存在する。
# このリポジトリ自身のPagesデプロイは、docsブランチ(tsuzuriで作ったユーザー向けサイト)
# 側の docs-pages.yml が単独で担当しており、このワークフローとは競合しない。
#
# 開発者が任意のブランチにpushしても、ここで実行されるのはlint・testだけであり、
# GitHub Pagesや外部リポジトリに影響する処理は一切走らない。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
