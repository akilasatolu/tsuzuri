name: "Tsuzuri: Deploy to GitHub Pages"

# tsuzuri v1.38.0 generated this self-contained workflow with npx github:akilasatolu/tsuzuri#v1 init.
# The build scripts (under .github/tsuzuri/) are also copied into this repository,
# so each run does not fetch the Tsuzuri repository (akilasatolu/tsuzuri).
# To update the scripts to the latest version, run npx github:akilasatolu/tsuzuri#v1 init --update.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

# Read-only by default. The permissions needed to publish to Pages are given only to the deploy job.
permissions:
  contents: read

# Runs on the same branch go one at a time, in the order of the pushes (so the content of a later push is
# not overwritten by the content of an earlier push). Groups are split per branch, so a push to a branch other than TRIGGER_BRANCH
# never pushes out and cancels a waiting deployment.
concurrency:
  group: tsuzuri-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.trigger.outputs.should_deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Load config
        run: |
          CONFIG_FILE=".github/tsuzuri/config"
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::Settings file $CONFIG_FILE not found. Check that the package files are placed correctly."
            exit 1
          fi

          # Strip leading and trailing whitespace (including the CR of CRLF). xargs is not used because it fails when a value contains ' or "
          trim() { printf '%s' "$1" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          while IFS='=' read -r key value || [ -n "$key" ]; do
            key="$(trim "$key")"
            value="$(trim "$value")"
            # Skip comment lines and blank lines
            case "$key" in
              ''|'#'*) continue ;;
            esac
            # Import only known setting keys as environment variables, so that others (such as NODE_OPTIONS)
            # cannot be injected through the settings file.
            case "$key" in
              TRIGGER_BRANCH|ROOT_MD|OUT_DIR|LANGUAGES|NAV_ENABLED|FAVICON_FILE|SITE_NAME|CUSTOM_DOMAIN|OGP_DEFAULT_IMAGE|THEME|STRICT_LINKS|SITEMAP_JSON|LAST_UPDATED|EDIT_LINK|REPO_LINK|REPO_VERSION|REPO_LICENSE|LLMS_TXT)
                echo "${key}=${value}" >> "$GITHUB_ENV" ;;
              *)
                echo "::warning::Ignoring unknown setting key ${key}" ;;
            esac
          done < "$CONFIG_FILE"

      - name: Check trigger branch
        id: trigger
        env:
          CURRENT_BRANCH: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Compare TRIGGER_BRANCH with the current ref, and always write should_deploy=true on a match or
          # should_deploy=false on a mismatch to $GITHUB_OUTPUT explicitly.
          # If the settings file has no TRIGGER_BRANCH, or it is empty, the repository's default branch is used.
          if [ -z "$TRIGGER_BRANCH" ]; then
            if [ -z "$DEFAULT_BRANCH" ]; then
              echo "::error::The settings file has no TRIGGER_BRANCH (or it is empty), and the repository's default branch could not be determined either. Write TRIGGER_BRANCH=<branch to deploy> in the settings file."
              exit 1
            fi
            TRIGGER_BRANCH="$DEFAULT_BRANCH"
            echo "The settings file has no TRIGGER_BRANCH (or it is empty), so the repository's default branch $TRIGGER_BRANCH is used"
          fi

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Skipping the branch check because this is a manual run"
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "$CURRENT_BRANCH" = "$TRIGGER_BRANCH" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping because this push ($CURRENT_BRANCH) is not to TRIGGER_BRANCH=$TRIGGER_BRANCH"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # BASE_PATH: the path when the site is not at the root of the domain (e.g. /repo).
      # SITE_ORIGIN: scheme and domain only, without a path (the URL of a page is SITE_ORIGIN + BASE_PATH + path).
      - name: Determine base path / site origin
        if: steps.trigger.outputs.should_deploy != 'false'
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          if [ -n "$CUSTOM_DOMAIN" ]; then
            BASE_PATH=""
            SITE_ORIGIN="https://${CUSTOM_DOMAIN}"
          elif [[ "$REPO_NAME" == *.github.io ]]; then
            BASE_PATH=""
            SITE_ORIGIN="https://${REPO_NAME}"
          else
            BASE_PATH="/${REPO_NAME}"
            SITE_ORIGIN="https://${OWNER}.github.io"
          fi
          echo "BASE_PATH=$BASE_PATH" >> "$GITHUB_ENV"
          echo "SITE_ORIGIN=$SITE_ORIGIN" >> "$GITHUB_ENV"

      # To get the last updated date (LAST_UPDATED=true) from the git history, fetch the full history only in that case
      # (checkout fetches only the latest commit by default, so the dates would not be correct as is)
      - name: Fetch full history for last-updated dates
        if: steps.trigger.outputs.should_deploy != 'false' && env.LAST_UPDATED == 'true'
        run: git fetch --unshallow --quiet || true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.trigger.outputs.should_deploy != 'false'
        with:
          node-version: 24

      # The build dependencies go into .github/tsuzuri/node_modules, separate from the user's package.json.
      # Their versions are written in .github/tsuzuri/package.json and installed exactly as listed in .github/tsuzuri/package-lock.json with npm ci,
      # so installation stops if the hash of a downloaded package differs. Install scripts are not run.
      # Then we also check that the dependencies were distributed with the official npm signatures.
      - name: Install build dependency
        if: steps.trigger.outputs.should_deploy != 'false'
        run: |
          npm ci --prefix .github/tsuzuri --ignore-scripts --no-audit --no-fund
          npm audit signatures --prefix .github/tsuzuri

      - name: Build
        if: steps.trigger.outputs.should_deploy != 'false'
        # The values of the settings file (written to $GITHUB_ENV by the Load config step) and BASE_PATH / SITE_ORIGIN
        # (written by the Determine base path / site origin step) are passed on as environment variables as they are.
        env:
          # The directory of base.css. Points to the vendored location copied by init (custom styles are always read from there too).
          STYLE_DIR: .github/tsuzuri/styles
        run: node .github/tsuzuri/build-docs.mjs

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.trigger.outputs.should_deploy != 'false'
        with:
          # If OUT_DIR is omitted or empty in the settings file, upload the same _site as the build writes
          path: ${{ env.OUT_DIR || '_site' }}

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    # Publishing to Pages is done one at a time regardless of the branch (a running deployment is not cancelled; they go in order).
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
